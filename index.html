<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Perspective AI Assistant</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f5f5;
  color: #1a1a1a;
  line-height: 1.6;
  padding: 24px;
  max-width: 1100px;
  margin: 0 auto;
}

h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
.subtitle { color: #666; font-size: 0.875rem; margin-bottom: 24px; }

/* Settings bar */
.settings-bar {
  display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
  background: #fff; border: 1px solid #ddd; border-radius: 8px;
  padding: 16px; margin-bottom: 16px;
}
.settings-bar label { font-size: 0.8rem; font-weight: 500; color: #555; display: block; margin-bottom: 4px; }
.settings-bar input[type="password"] {
  width: 320px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem;
}
.settings-bar select {
  padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; background: #fff;
}

/* Presets bar */
.presets-bar {
  display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;
  background: #fff; border: 1px solid #ddd; border-radius: 8px;
  padding: 12px 16px; margin-bottom: 16px;
}
.presets-bar label { font-size: 0.8rem; font-weight: 500; color: #555; display: block; margin-bottom: 4px; }
.presets-bar select { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.82rem; background: #fff; min-width: 180px; }
.presets-bar input[type="text"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.82rem; width: 180px; }
.btn-sm {
  padding: 6px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.78rem;
  cursor: pointer; background: #fff; color: #333;
}
.btn-sm:hover { background: #f0f0f0; }
.btn-sm.danger { color: #dc3545; border-color: #dc3545; }
.btn-sm.danger:hover { background: #fef0f0; }

/* Agent config panels */
.agents-config { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

.agent-panel {
  background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;
}
.agent-header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; user-select: none;
}
.agent-header:hover { background: #fafafa; }
.agent-header .toggle-arrow {
  font-size: 0.75rem; color: #999; transition: transform 0.2s; width: 12px;
}
.agent-header .toggle-arrow.open { transform: rotate(90deg); }
.agent-header input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
.agent-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
.agent-name.disabled { color: #aaa; }
.agent-temp-display { font-size: 0.75rem; color: #888; white-space: nowrap; }

.agent-body {
  display: none; padding: 12px 16px; border-top: 1px solid #eee; background: #fafafa;
}
.agent-body.open { display: block; }
.agent-body label { font-size: 0.75rem; font-weight: 500; color: #666; display: block; margin-bottom: 4px; }
.agent-body textarea {
  width: 100%; min-height: 80px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
  font-family: inherit; font-size: 0.82rem; resize: vertical; line-height: 1.5;
}
.temp-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.temp-row input[type="range"] { flex: 1; max-width: 200px; }
.temp-row .temp-value { font-size: 0.8rem; color: #555; min-width: 32px; }

/* Prompt area */
.prompt-area {
  background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px;
}
.prompt-area textarea {
  width: 100%; min-height: 100px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px;
  font-family: inherit; font-size: 0.9rem; resize: vertical; line-height: 1.5;
}
.prompt-actions { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.btn-analyze {
  padding: 10px 28px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px;
  font-size: 0.9rem; font-weight: 500; cursor: pointer;
}
.btn-analyze:hover { background: #333; }
.btn-analyze:disabled { background: #999; cursor: not-allowed; }
.btn-stop {
  padding: 10px 20px; background: #dc3545; color: #fff; border: none; border-radius: 6px;
  font-size: 0.9rem; font-weight: 500; cursor: pointer; display: none;
}
.btn-stop:hover { background: #c82333; }
.btn-export {
  padding: 8px 18px; background: #fff; color: #333; border: 1px solid #ccc; border-radius: 6px;
  font-size: 0.82rem; cursor: pointer; display: none;
}
.btn-export:hover { background: #f0f0f0; }
.status-text { font-size: 0.82rem; color: #888; }

/* History panel */
.history-panel {
  background: #fff; border: 1px solid #ddd; border-radius: 8px;
  margin-bottom: 16px; overflow: hidden;
}
.history-header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; user-select: none;
}
.history-header:hover { background: #fafafa; }
.history-header .toggle-arrow { font-size: 0.75rem; color: #999; transition: transform 0.2s; width: 12px; }
.history-header .toggle-arrow.open { transform: rotate(90deg); }
.history-title { font-weight: 600; font-size: 0.9rem; flex: 1; }
.history-count { font-size: 0.75rem; color: #888; }
.history-body { display: none; border-top: 1px solid #eee; max-height: 300px; overflow-y: auto; }
.history-body.open { display: block; }
.history-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 0.82rem;
}
.history-item:last-child { border-bottom: none; }
.history-item:hover { background: #fafafa; }
.history-item-date { color: #888; white-space: nowrap; font-size: 0.75rem; min-width: 120px; }
.history-item-prompt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-item-delete {
  padding: 2px 8px; border: 1px solid #ddd; border-radius: 4px; background: #fff;
  font-size: 0.7rem; color: #999; cursor: pointer;
}
.history-item-delete:hover { color: #dc3545; border-color: #dc3545; }
.history-empty { padding: 16px; text-align: center; color: #999; font-size: 0.82rem; }
.history-search {
  padding: 8px 16px; border-bottom: 1px solid #eee;
}
.history-search input {
  width: 100%; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.82rem;
}

/* Results */
.results { display: flex; flex-direction: column; gap: 16px; }

.result-card {
  background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;
}
.result-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid #eee;
}
.result-agent-name { font-weight: 600; font-size: 0.9rem; }
.result-header-actions { display: flex; gap: 6px; }
.btn-copy {
  padding: 4px 12px; background: #eee; border: 1px solid #ccc; border-radius: 4px;
  font-size: 0.75rem; cursor: pointer; color: #555;
}
.btn-copy:hover { background: #ddd; }
.result-card-body {
  padding: 16px; font-size: 0.88rem; line-height: 1.7; overflow-wrap: break-word;
}
.result-card-body h1, .result-card-body h2, .result-card-body h3 { margin: 12px 0 6px; }
.result-card-body h1 { font-size: 1.15rem; }
.result-card-body h2 { font-size: 1.05rem; }
.result-card-body h3 { font-size: 0.95rem; }
.result-card-body ul, .result-card-body ol { padding-left: 20px; margin: 6px 0; }
.result-card-body p { margin: 6px 0; }
.result-card-body code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 0.84rem; }
.result-card-body pre { background: #f0f0f0; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
.result-card-body pre code { background: none; padding: 0; }
.result-card-body blockquote { border-left: 3px solid #ccc; padding-left: 12px; color: #555; margin: 6px 0; }
.result-card-body strong { font-weight: 600; }
.result-card-body em { font-style: italic; }

/* Follow-up */
.followup-area {
  display: none; padding: 12px 16px; border-top: 1px solid #eee; background: #fafafa;
}
.followup-area.open { display: flex; gap: 8px; align-items: flex-start; }
.followup-area textarea {
  flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
  font-family: inherit; font-size: 0.82rem; resize: vertical; min-height: 40px; line-height: 1.4;
}
.btn-followup {
  padding: 8px 16px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px;
  font-size: 0.8rem; cursor: pointer; white-space: nowrap;
}
.btn-followup:hover { background: #333; }
.btn-followup:disabled { background: #999; cursor: not-allowed; }

.spinner {
  display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc;
  border-top-color: #333; border-radius: 50%; animation: spin 0.6s linear infinite;
  margin-right: 6px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

.agent-color-1 { border-left: 4px solid #6c5ce7; }
.agent-color-1 .result-agent-name { color: #6c5ce7; }
.agent-color-2a { border-left: 4px solid #00b894; }
.agent-color-2a .result-agent-name { color: #00b894; }
.agent-color-2b { border-left: 4px solid #e17055; }
.agent-color-2b .result-agent-name { color: #e17055; }
.agent-color-3 { border-left: 4px solid #0984e3; }
.agent-color-3 .result-agent-name { color: #0984e3; }
</style>
</head>
<body>

<h1>Multi-Perspective AI Assistant</h1>
<p class="subtitle">Analyze problems from multiple viewpoints using Claude</p>

<!-- Settings -->
<div class="settings-bar">
  <div>
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." />
  </div>
  <div>
    <label for="modelSelect">Model</label>
    <select id="modelSelect">
      <option value="claude-opus-4-0-20250115">Claude Opus 4</option>
      <option value="claude-sonnet-4-20250514" selected>Claude Sonnet 4</option>
      <option value="claude-haiku-4-20250414">Claude Haiku 4</option>
    </select>
  </div>
</div>

<!-- Presets -->
<div class="presets-bar">
  <div>
    <label>Presets</label>
    <select id="presetSelect" onchange="loadPreset()">
      <option value="">-- Default --</option>
    </select>
  </div>
  <input type="text" id="presetName" placeholder="New preset name..." />
  <button class="btn-sm" onclick="savePreset()">Save preset</button>
  <button class="btn-sm danger" onclick="deletePreset()">Delete</button>
</div>

<!-- Agent Config -->
<div class="agents-config" id="agentsConfig"></div>

<!-- History -->
<div class="history-panel">
  <div class="history-header" onclick="toggleHistory()">
    <span class="toggle-arrow" id="historyArrow">&#9654;</span>
    <span class="history-title">History</span>
    <span class="history-count" id="historyCount"></span>
  </div>
  <div class="history-body" id="historyBody">
    <div class="history-search">
      <input type="text" id="historySearch" placeholder="Search history..." oninput="renderHistory()" />
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- Prompt Input -->
<div class="prompt-area">
  <textarea id="promptInput" placeholder="Describe the problem or topic you want analyzed from multiple perspectives..."></textarea>
  <div class="prompt-actions">
    <button class="btn-analyze" id="btnAnalyze" onclick="runAnalysis()">Analyze</button>
    <button class="btn-stop" id="btnStop" onclick="stopAnalysis()">Stop</button>
    <button class="btn-export" id="btnExport" onclick="exportAnalysis()">Export Markdown</button>
    <span class="status-text" id="statusText"></span>
  </div>
</div>

<!-- Results -->
<div class="results" id="results"></div>

<script>
// ── Agent definitions ──
const AGENTS = [
  {
    id: 'visionary',
    name: '1. Visionary / Creative',
    colorClass: 'agent-color-1',
    defaultPrompt: `You are a visionary and creative thinker. Your role is to analyze the given problem with imagination, originality, and bold thinking. Look beyond conventional approaches. Propose innovative ideas, unexpected connections, and creative possibilities. Think about what could be rather than what is. Be ambitious and inspiring, but still grounded enough to be actionable.`,
    defaultTemp: 0.9,
  },
  {
    id: 'optimistic',
    name: '2a. Optimistic',
    colorClass: 'agent-color-2a',
    defaultPrompt: `You are an optimistic analyst. You have received a creative/visionary analysis of a problem. Your role is to build on it by identifying the strongest opportunities, best-case scenarios, and most promising paths forward. Highlight potential benefits, favorable conditions, and reasons for confidence. Be genuinely encouraging but substantive — back your optimism with reasoning.`,
    defaultTemp: 0.7,
  },
  {
    id: 'sceptical',
    name: '2b. Sceptical',
    colorClass: 'agent-color-2b',
    defaultPrompt: `You are a sceptical analyst and critical thinker. You have received a creative/visionary analysis of a problem. Your role is to stress-test it by identifying risks, weaknesses, blind spots, and potential failure modes. Ask the hard questions. Challenge assumptions. Point out what could go wrong and what has been overlooked. Be constructively critical — your goal is to strengthen the final outcome, not to shut ideas down.`,
    defaultTemp: 0.5,
  },
  {
    id: 'neutral',
    name: '3. Neutral Summarizer',
    colorClass: 'agent-color-3',
    defaultPrompt: `You are a neutral, balanced synthesizer. You have received analyses from multiple perspectives: a visionary/creative view, an optimistic view, and a sceptical view. Your role is to:
1. Summarize the key arguments from each perspective fairly
2. Identify areas of agreement and disagreement
3. Weigh the arguments and propose a balanced, actionable recommendation
4. Suggest a concrete way forward that accounts for both opportunities and risks

Be clear, structured, and pragmatic.`,
    defaultTemp: 0.4,
  },
];

// ── State ──
let abortController = null;
// Stores raw text per agent for the current analysis (for export, follow-up, history)
let currentResults = {};
let currentPrompt = '';

// ── LocalStorage helpers ──
function lsGet(key, fallback) {
  try { const v = localStorage.getItem('mpai_' + key); return v !== null ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem('mpai_' + key, JSON.stringify(value)); } catch {}
}

// ── Init UI ──
function initSettings() {
  document.getElementById('apiKey').value = lsGet('apiKey', '');
  document.getElementById('apiKey').addEventListener('input', e => lsSet('apiKey', e.target.value));

  const savedModel = lsGet('model', 'claude-sonnet-4-20250514');
  document.getElementById('modelSelect').value = savedModel;
  document.getElementById('modelSelect').addEventListener('change', e => lsSet('model', e.target.value));

  // Ctrl+Enter to submit
  document.getElementById('promptInput').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runAnalysis(); }
  });
}

function initAgentPanels() {
  const container = document.getElementById('agentsConfig');
  container.innerHTML = '';
  AGENTS.forEach(agent => {
    const enabled = lsGet(`agent_${agent.id}_enabled`, true);
    const prompt = lsGet(`agent_${agent.id}_prompt`, agent.defaultPrompt);
    const temp = lsGet(`agent_${agent.id}_temp`, agent.defaultTemp);

    const panel = document.createElement('div');
    panel.className = 'agent-panel';
    panel.innerHTML = `
      <div class="agent-header" onclick="togglePanel('${agent.id}', event)">
        <span class="toggle-arrow" id="arrow_${agent.id}">&#9654;</span>
        <input type="checkbox" id="enabled_${agent.id}" ${enabled ? 'checked' : ''}
               onclick="event.stopPropagation(); saveAgentEnabled('${agent.id}')" />
        <span class="agent-name ${enabled ? '' : 'disabled'}" id="name_${agent.id}">${agent.name}</span>
        <span class="agent-temp-display" id="tempDisplay_${agent.id}">temp: ${temp.toFixed(1)}</span>
      </div>
      <div class="agent-body" id="body_${agent.id}">
        <label>System Prompt</label>
        <textarea id="prompt_${agent.id}" oninput="saveAgentPrompt('${agent.id}')">${escapeHtml(prompt)}</textarea>
        <div class="temp-row">
          <label>Temperature</label>
          <input type="range" min="0" max="1" step="0.1" value="${temp}"
                 id="temp_${agent.id}" oninput="saveAgentTemp('${agent.id}')" />
          <span class="temp-value" id="tempVal_${agent.id}">${temp.toFixed(1)}</span>
        </div>
      </div>
    `;
    container.appendChild(panel);
  });
}

function togglePanel(agentId, event) {
  if (event.target.type === 'checkbox') return;
  const body = document.getElementById('body_' + agentId);
  const arrow = document.getElementById('arrow_' + agentId);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function saveAgentEnabled(agentId) {
  const checked = document.getElementById('enabled_' + agentId).checked;
  lsSet(`agent_${agentId}_enabled`, checked);
  const nameEl = document.getElementById('name_' + agentId);
  nameEl.classList.toggle('disabled', !checked);
}

function saveAgentPrompt(agentId) {
  lsSet(`agent_${agentId}_prompt`, document.getElementById('prompt_' + agentId).value);
}

function saveAgentTemp(agentId) {
  const val = parseFloat(document.getElementById('temp_' + agentId).value);
  lsSet(`agent_${agentId}_temp`, val);
  document.getElementById('tempVal_' + agentId).textContent = val.toFixed(1);
  document.getElementById('tempDisplay_' + agentId).textContent = 'temp: ' + val.toFixed(1);
}

// ══════════════════════════════════
// ── Presets ──
// ══════════════════════════════════

function getPresets() { return lsGet('presets', {}); }
function setPresets(p) { lsSet('presets', p); }

function refreshPresetSelect() {
  const sel = document.getElementById('presetSelect');
  const current = sel.value;
  sel.innerHTML = '<option value="">-- Default --</option>';
  const presets = getPresets();
  Object.keys(presets).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function savePreset() {
  const nameInput = document.getElementById('presetName');
  const name = nameInput.value.trim();
  if (!name) return alert('Enter a preset name.');
  const config = {};
  AGENTS.forEach(a => {
    config[a.id] = {
      enabled: lsGet(`agent_${a.id}_enabled`, true),
      prompt: lsGet(`agent_${a.id}_prompt`, a.defaultPrompt),
      temp: lsGet(`agent_${a.id}_temp`, a.defaultTemp),
    };
  });
  const presets = getPresets();
  presets[name] = config;
  setPresets(presets);
  refreshPresetSelect();
  document.getElementById('presetSelect').value = name;
  nameInput.value = '';
}

function loadPreset() {
  const name = document.getElementById('presetSelect').value;
  if (!name) {
    // Reset to defaults
    AGENTS.forEach(a => {
      lsSet(`agent_${a.id}_enabled`, true);
      lsSet(`agent_${a.id}_prompt`, a.defaultPrompt);
      lsSet(`agent_${a.id}_temp`, a.defaultTemp);
    });
  } else {
    const presets = getPresets();
    const config = presets[name];
    if (!config) return;
    AGENTS.forEach(a => {
      const c = config[a.id];
      if (!c) return;
      lsSet(`agent_${a.id}_enabled`, c.enabled);
      lsSet(`agent_${a.id}_prompt`, c.prompt);
      lsSet(`agent_${a.id}_temp`, c.temp);
    });
  }
  initAgentPanels();
}

function deletePreset() {
  const name = document.getElementById('presetSelect').value;
  if (!name) return;
  if (!confirm(`Delete preset "${name}"?`)) return;
  const presets = getPresets();
  delete presets[name];
  setPresets(presets);
  document.getElementById('presetSelect').value = '';
  refreshPresetSelect();
}

// ══════════════════════════════════
// ── History ──
// ══════════════════════════════════

function getHistory() { return lsGet('history', []); }
function setHistory(h) { lsSet('history', h); }

function toggleHistory() {
  const body = document.getElementById('historyBody');
  const arrow = document.getElementById('historyArrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
  if (body.classList.contains('open')) renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const search = document.getElementById('historySearch').value.toLowerCase();
  const history = getHistory();
  const count = document.getElementById('historyCount');
  count.textContent = `${history.length} saved`;

  const filtered = history.filter(h =>
    h.prompt.toLowerCase().includes(search) ||
    (h.date && h.date.toLowerCase().includes(search))
  );

  if (filtered.length === 0) {
    list.innerHTML = '<div class="history-empty">No analyses saved yet.</div>';
    return;
  }

  list.innerHTML = filtered.map((h, realIdx) => {
    const idx = history.indexOf(h);
    const date = h.date || 'Unknown date';
    const preview = h.prompt.length > 80 ? h.prompt.slice(0, 80) + '...' : h.prompt;
    return `<div class="history-item">
      <span class="history-item-date">${escapeHtml(date)}</span>
      <span class="history-item-prompt" onclick="loadHistory(${idx})">${escapeHtml(preview)}</span>
      <button class="history-item-delete" onclick="event.stopPropagation(); deleteHistory(${idx})">delete</button>
    </div>`;
  }).join('');
}

function saveToHistory(prompt, results) {
  const history = getHistory();
  const entry = {
    date: new Date().toLocaleString(),
    prompt: prompt,
    results: { ...results },
  };
  history.unshift(entry);
  // Keep max 50 entries
  if (history.length > 50) history.length = 50;
  setHistory(history);
  renderHistory();
}

function loadHistory(idx) {
  const history = getHistory();
  const entry = history[idx];
  if (!entry) return;

  document.getElementById('promptInput').value = entry.prompt;
  currentPrompt = entry.prompt;
  currentResults = { ...entry.results };

  const resultsContainer = document.getElementById('results');
  resultsContainer.innerHTML = '';

  AGENTS.forEach(agent => {
    if (entry.results[agent.id]) {
      const card = createResultCard(agent, true);
      resultsContainer.appendChild(card);
      document.getElementById('output_' + agent.id).innerHTML = renderMarkdown(entry.results[agent.id]);
    }
  });

  document.getElementById('btnExport').style.display = '';
  document.getElementById('statusText').textContent = 'Loaded from history.';
}

function deleteHistory(idx) {
  const history = getHistory();
  history.splice(idx, 1);
  setHistory(history);
  renderHistory();
}

// ══════════════════════════════════
// ── Markdown rendering (lightweight) ──
// ══════════════════════════════════

function renderMarkdown(text) {
  let html = escapeHtml(text);

  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Unordered lists
  html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  // Ordered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Line breaks
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');
  // Fix paragraphs around block elements
  html = html.replace(/<p>(<h[123]>)/g, '$1');
  html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');

  return html;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ══════════════════════════════════
// ── Export ──
// ══════════════════════════════════

function exportAnalysis() {
  if (!currentPrompt) return;

  let md = `# Multi-Perspective Analysis\n\n`;
  md += `**Date:** ${new Date().toLocaleString()}\n\n`;
  md += `## Prompt\n\n${currentPrompt}\n\n`;

  AGENTS.forEach(agent => {
    if (currentResults[agent.id]) {
      md += `---\n\n## ${agent.name}\n\n${currentResults[agent.id]}\n\n`;
    }
  });

  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const slug = currentPrompt.slice(0, 40).replace(/[^a-zA-Z0-9]+/g, '-').replace(/-+$/, '');
  a.download = `analysis-${slug}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

// ══════════════════════════════════
// ── API call ──
// ══════════════════════════════════

async function callClaude(systemPrompt, messages, temperature, signal) {
  const apiKey = lsGet('apiKey', '');
  const model = document.getElementById('modelSelect').value;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: model,
      max_tokens: 4096,
      temperature: temperature,
      system: systemPrompt,
      messages: messages,
      stream: true,
    }),
    signal: signal,
  });

  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API error ${response.status}: ${err}`);
  }

  return response.body;
}

async function streamResponse(stream, outputEl) {
  const reader = stream.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (line.startsWith('data: ')) {
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
            fullText += parsed.delta.text;
            outputEl.innerHTML = renderMarkdown(fullText);
          }
        } catch {}
      }
    }
  }

  return fullText;
}

// ══════════════════════════════════
// ── Result cards ──
// ══════════════════════════════════

function createResultCard(agent, showFollowup) {
  const card = document.createElement('div');
  card.className = `result-card ${agent.colorClass}`;
  card.id = `result_${agent.id}`;
  card.innerHTML = `
    <div class="result-card-header">
      <span class="result-agent-name">${showFollowup ? '' : '<span class="spinner"></span>'}${agent.name}</span>
      <div class="result-header-actions">
        <button class="btn-copy" onclick="copyResult('${agent.id}')" ${showFollowup ? '' : 'style="display:none"'} id="copyBtn_${agent.id}">Copy</button>
      </div>
    </div>
    <div class="result-card-body" id="output_${agent.id}"></div>
    <div class="followup-area ${showFollowup ? 'open' : ''}" id="followup_${agent.id}">
      <textarea id="followupInput_${agent.id}" placeholder="Ask a follow-up question to this agent..."
                onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();runFollowup('${agent.id}')}"></textarea>
      <button class="btn-followup" onclick="runFollowup('${agent.id}')" id="followupBtn_${agent.id}">Ask</button>
    </div>
  `;
  return card;
}

function copyResult(agentId) {
  const el = document.getElementById('output_' + agentId);
  const text = el.innerText || el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn_' + agentId);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

function finishCard(agentId) {
  const card = document.getElementById('result_' + agentId);
  if (!card) return;
  const spinner = card.querySelector('.spinner');
  if (spinner) spinner.remove();
  const copyBtn = document.getElementById('copyBtn_' + agentId);
  if (copyBtn) copyBtn.style.display = '';
  const followup = document.getElementById('followup_' + agentId);
  if (followup) followup.classList.add('open');
}

// ══════════════════════════════════
// ── Follow-up ──
// ══════════════════════════════════

async function runFollowup(agentId) {
  const input = document.getElementById('followupInput_' + agentId);
  const question = input.value.trim();
  if (!question) return;
  if (!lsGet('apiKey', '')) return alert('Please enter your API key.');

  const agent = AGENTS.find(a => a.id === agentId);
  const btn = document.getElementById('followupBtn_' + agentId);
  const outputEl = document.getElementById('output_' + agentId);
  const prevContent = currentResults[agentId] || '';

  btn.disabled = true;
  btn.textContent = '...';

  // Append a separator to the existing output
  const separator = document.createElement('hr');
  separator.style.cssText = 'margin: 16px 0; border: none; border-top: 1px solid #ddd;';
  outputEl.appendChild(separator);

  const followupOutput = document.createElement('div');
  followupOutput.innerHTML = '<span class="spinner"></span>';
  outputEl.appendChild(followupOutput);

  const followupAbort = new AbortController();

  try {
    const systemPrompt = lsGet(`agent_${agentId}_prompt`, agent.defaultPrompt);
    const temp = lsGet(`agent_${agentId}_temp`, agent.defaultTemp);

    // Build a multi-turn conversation: original context, agent's response, then follow-up
    let contextMsg = currentPrompt;
    // For agents 2a/2b, include visionary output in context if available
    if ((agentId === 'optimistic' || agentId === 'sceptical') && currentResults.visionary) {
      contextMsg = `Original problem/topic:\n${currentPrompt}\n\n---\n\nVisionary / Creative analysis:\n${currentResults.visionary}`;
    }
    // For neutral, include all available outputs
    if (agentId === 'neutral') {
      contextMsg = `Original problem/topic:\n${currentPrompt}`;
      if (currentResults.visionary) contextMsg += `\n\n---\n\nVisionary / Creative analysis:\n${currentResults.visionary}`;
      if (currentResults.optimistic) contextMsg += `\n\n---\n\nOptimistic analysis:\n${currentResults.optimistic}`;
      if (currentResults.sceptical) contextMsg += `\n\n---\n\nSceptical analysis:\n${currentResults.sceptical}`;
    }

    const messages = [
      { role: 'user', content: contextMsg },
      { role: 'assistant', content: prevContent },
      { role: 'user', content: question },
    ];

    const stream = await callClaude(systemPrompt, messages, temp, followupAbort.signal);
    const result = await streamResponse(stream, followupOutput);

    // Update stored result with the follow-up appended
    currentResults[agentId] = prevContent + '\n\n---\n\n**Follow-up:** ' + question + '\n\n' + result;

    input.value = '';
  } catch (err) {
    followupOutput.innerHTML = `<p style="color:#dc3545">Error: ${escapeHtml(err.message)}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ask';
  }
}

// ══════════════════════════════════
// ── Main analysis flow ──
// ══════════════════════════════════

async function runAnalysis() {
  const prompt = document.getElementById('promptInput').value.trim();
  if (!prompt) return alert('Please enter a prompt.');
  if (!lsGet('apiKey', '')) return alert('Please enter your API key.');

  const btnAnalyze = document.getElementById('btnAnalyze');
  const btnStop = document.getElementById('btnStop');
  const btnExport = document.getElementById('btnExport');
  const statusText = document.getElementById('statusText');
  const resultsContainer = document.getElementById('results');

  btnAnalyze.disabled = true;
  btnStop.style.display = '';
  btnExport.style.display = 'none';
  resultsContainer.innerHTML = '';
  abortController = new AbortController();
  currentResults = {};
  currentPrompt = prompt;

  const enabledAgents = {};
  AGENTS.forEach(a => {
    enabledAgents[a.id] = lsGet(`agent_${a.id}_enabled`, true);
  });

  function getPrompt(agentId) { return lsGet(`agent_${agentId}_prompt`, AGENTS.find(a => a.id === agentId).defaultPrompt); }
  function getTemp(agentId) { return lsGet(`agent_${agentId}_temp`, AGENTS.find(a => a.id === agentId).defaultTemp); }

  try {
    let visionaryOutput = '';

    // ── Step 1: Visionary ──
    if (enabledAgents.visionary) {
      statusText.textContent = 'Running Visionary / Creative...';
      const card = createResultCard(AGENTS[0], false);
      resultsContainer.appendChild(card);
      const outputEl = document.getElementById('output_visionary');

      const stream = await callClaude(getPrompt('visionary'), [{ role: 'user', content: prompt }], getTemp('visionary'), abortController.signal);
      visionaryOutput = await streamResponse(stream, outputEl);
      currentResults.visionary = visionaryOutput;
      finishCard('visionary');
    }

    // ── Step 2: Optimistic + Sceptical in parallel ──
    const step2Agents = [];
    if (enabledAgents.optimistic) step2Agents.push(AGENTS[1]);
    if (enabledAgents.sceptical) step2Agents.push(AGENTS[2]);

    if (step2Agents.length > 0) {
      let step2UserMsg = prompt;
      if (visionaryOutput) {
        step2UserMsg = `Original problem/topic:\n${prompt}\n\n---\n\nVisionary / Creative analysis:\n${visionaryOutput}`;
      }

      step2Agents.forEach(a => {
        const card = createResultCard(a, false);
        resultsContainer.appendChild(card);
      });

      const statusParts = step2Agents.map(a => a.name).join(' + ');
      statusText.textContent = `Running ${statusParts}...`;

      const promises = step2Agents.map(async agent => {
        const outputEl = document.getElementById('output_' + agent.id);
        const stream = await callClaude(getPrompt(agent.id), [{ role: 'user', content: step2UserMsg }], getTemp(agent.id), abortController.signal);
        const result = await streamResponse(stream, outputEl);
        currentResults[agent.id] = result;
        finishCard(agent.id);
      });

      await Promise.all(promises);
    }

    // ── Step 3: Neutral Summarizer ──
    if (enabledAgents.neutral) {
      statusText.textContent = 'Running Neutral Summarizer...';
      const card = createResultCard(AGENTS[3], false);
      resultsContainer.appendChild(card);
      const outputEl = document.getElementById('output_neutral');

      let summarizerInput = `Original problem/topic:\n${prompt}`;
      if (currentResults.visionary) {
        summarizerInput += `\n\n---\n\nVisionary / Creative analysis:\n${currentResults.visionary}`;
      }
      if (currentResults.optimistic) {
        summarizerInput += `\n\n---\n\nOptimistic analysis:\n${currentResults.optimistic}`;
      }
      if (currentResults.sceptical) {
        summarizerInput += `\n\n---\n\nSceptical analysis:\n${currentResults.sceptical}`;
      }

      const stream = await callClaude(getPrompt('neutral'), [{ role: 'user', content: summarizerInput }], getTemp('neutral'), abortController.signal);
      const result = await streamResponse(stream, outputEl);
      currentResults.neutral = result;
      finishCard('neutral');
    }

    // Save to history
    saveToHistory(prompt, currentResults);

    statusText.textContent = 'Done.';
    btnExport.style.display = '';
  } catch (err) {
    if (err.name === 'AbortError') {
      statusText.textContent = 'Stopped.';
    } else {
      statusText.textContent = 'Error: ' + err.message;
      console.error(err);
    }
    // Still show export if we have partial results
    if (Object.keys(currentResults).length > 0) {
      btnExport.style.display = '';
      saveToHistory(prompt, currentResults);
    }
  } finally {
    btnAnalyze.disabled = false;
    btnStop.style.display = 'none';
    abortController = null;
  }
}

function stopAnalysis() {
  if (abortController) abortController.abort();
}

// ── Boot ──
initSettings();
initAgentPanels();
refreshPresetSelect();
renderHistory();
</script>
