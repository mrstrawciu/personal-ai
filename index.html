<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Perspective AI Assistant</title>
<script>
// Apply dark mode before first paint to prevent flash
if ((() => { try { return JSON.parse(localStorage.getItem('mpai_darkMode')); } catch { return false; } })()) {
  document.documentElement.setAttribute('data-theme', 'dark');
}
</script>
<style>
:root {
  --bg-page: #f5f5f5;
  --bg-card: #fff;
  --bg-card-hover: #fafafa;
  --bg-card-alt: #fafafa;
  --bg-input: #fff;
  --bg-code: #f0f0f0;
  --text-primary: #1a1a1a;
  --text-secondary: #666;
  --text-muted: #888;
  --text-disabled: #aaa;
  --border-main: #ddd;
  --border-light: #eee;
  --border-subtle: #f0f0f0;
  --border-input: #ccc;
  --btn-primary-bg: #1a1a1a;
  --btn-primary-text: #fff;
  --btn-primary-hover: #333;
  --btn-danger: #dc3545;
  --btn-danger-hover: #c82333;
  --btn-danger-bg-hover: #fef0f0;
  --btn-secondary-bg: #fff;
  --btn-secondary-hover: #f0f0f0;
  --btn-copy-bg: #eee;
  --btn-copy-hover: #ddd;
  --spinner-track: #ccc;
  --spinner-head: #333;
  --blockquote-border: #ccc;
  --blockquote-text: #555;
}

[data-theme="dark"] {
  --bg-page: #0f0f1a;
  --bg-card: #1a1a2e;
  --bg-card-hover: #222244;
  --bg-card-alt: #151528;
  --bg-input: #1a1a2e;
  --bg-code: #12122a;
  --text-primary: #e0e0e8;
  --text-secondary: #a0a0b0;
  --text-muted: #707088;
  --text-disabled: #505068;
  --border-main: #2a2a4a;
  --border-light: #222240;
  --border-subtle: #1e1e38;
  --border-input: #3a3a5a;
  --btn-primary-bg: #4a4ae0;
  --btn-primary-text: #fff;
  --btn-primary-hover: #5a5af0;
  --btn-danger: #e94560;
  --btn-danger-hover: #d63050;
  --btn-danger-bg-hover: #2a1520;
  --btn-secondary-bg: #1a1a2e;
  --btn-secondary-hover: #222244;
  --btn-copy-bg: #222240;
  --btn-copy-hover: #2a2a4a;
  --spinner-track: #2a2a4a;
  --spinner-head: #4a4ae0;
  --blockquote-border: #3a3a5a;
  --blockquote-text: #a0a0b0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-page);
  color: var(--text-primary);
  line-height: 1.6;
  padding: 24px;
  max-width: 1100px;
  margin: 0 auto;
}

h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
.subtitle { color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 24px; }

/* Settings bar */
.settings-bar {
  display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
  background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 8px;
  padding: 16px; margin-bottom: 16px;
}
.settings-bar label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.settings-bar input[type="password"] {
  width: 320px; padding: 8px 10px; border: 1px solid var(--border-input); border-radius: 6px;
  font-size: 0.85rem; background: var(--bg-input); color: var(--text-primary);
}
.settings-bar select {
  padding: 8px 10px; border: 1px solid var(--border-input); border-radius: 6px;
  font-size: 0.85rem; background: var(--bg-input); color: var(--text-primary);
}

.btn-dark-toggle {
  padding: 8px 14px; background: var(--btn-secondary-bg); border: 1px solid var(--border-input);
  border-radius: 6px; cursor: pointer; font-size: 0.82rem; color: var(--text-primary);
}
.btn-dark-toggle:hover { background: var(--btn-secondary-hover); }

/* Presets bar */
.presets-bar {
  display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;
  background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 16px;
}
.presets-bar label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.presets-bar select {
  padding: 6px 10px; border: 1px solid var(--border-input); border-radius: 6px;
  font-size: 0.82rem; background: var(--bg-input); color: var(--text-primary); min-width: 180px;
}
.presets-bar input[type="text"] {
  padding: 6px 10px; border: 1px solid var(--border-input); border-radius: 6px;
  font-size: 0.82rem; width: 180px; background: var(--bg-input); color: var(--text-primary);
}
.btn-sm {
  padding: 6px 14px; border: 1px solid var(--border-input); border-radius: 6px; font-size: 0.78rem;
  cursor: pointer; background: var(--btn-secondary-bg); color: var(--text-primary);
}
.btn-sm:hover { background: var(--btn-secondary-hover); }
.btn-sm.danger { color: var(--btn-danger); border-color: var(--btn-danger); }
.btn-sm.danger:hover { background: var(--btn-danger-bg-hover); }

/* Agent config panels */
.agents-config { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

.agent-panel {
  background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 8px; overflow: hidden;
}
.agent-header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; user-select: none;
}
.agent-header:hover { background: var(--bg-card-hover); }
.agent-header .toggle-arrow {
  font-size: 0.75rem; color: var(--text-muted); transition: transform 0.2s; width: 12px;
}
.agent-header .toggle-arrow.open { transform: rotate(90deg); }
.agent-header input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
.agent-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
.agent-name.disabled { opacity: 0.4; }
.agent-temp-display { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }

.agent-phase-badge {
  font-size: 0.65rem; padding: 1px 7px; border-radius: 8px;
  background: var(--bg-code); color: var(--text-muted); white-space: nowrap;
}

.agent-body {
  display: none; padding: 12px 16px; border-top: 1px solid var(--border-light); background: var(--bg-card-alt);
}
.agent-body.open { display: block; }
.agent-body label { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.agent-body textarea {
  width: 100%; min-height: 80px; padding: 8px 10px; border: 1px solid var(--border-input); border-radius: 6px;
  font-family: inherit; font-size: 0.82rem; resize: vertical; line-height: 1.5;
  background: var(--bg-input); color: var(--text-primary);
}
.agent-body input[type="text"], .agent-body select {
  padding: 6px 10px; border: 1px solid var(--border-input); border-radius: 6px;
  font-size: 0.82rem; background: var(--bg-input); color: var(--text-primary);
}
.temp-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.temp-row input[type="range"] { flex: 1; max-width: 200px; }
.temp-row .temp-value { font-size: 0.8rem; color: var(--text-secondary); min-width: 32px; }

.btn-remove-agent {
  padding: 2px 10px; border: 1px solid var(--btn-danger); border-radius: 4px;
  background: transparent; color: var(--btn-danger); font-size: 0.7rem; cursor: pointer;
}
.btn-remove-agent:hover { background: var(--btn-danger-bg-hover); }

.btn-add-agent {
  padding: 8px 18px; background: var(--btn-secondary-bg); border: 1px dashed var(--border-input);
  border-radius: 8px; cursor: pointer; font-size: 0.82rem; color: var(--text-secondary);
  width: 100%; text-align: center;
}
.btn-add-agent:hover { background: var(--btn-secondary-hover); border-color: var(--text-muted); }

/* Prompt area */
.prompt-area {
  background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 8px;
  padding: 16px; margin-bottom: 16px;
}
.prompt-area textarea {
  width: 100%; min-height: 100px; padding: 10px 12px; border: 1px solid var(--border-input); border-radius: 6px;
  font-family: inherit; font-size: 0.9rem; resize: vertical; line-height: 1.5;
  background: var(--bg-input); color: var(--text-primary);
}
.prompt-actions { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.btn-analyze {
  padding: 10px 28px; background: var(--btn-primary-bg); color: var(--btn-primary-text); border: none; border-radius: 6px;
  font-size: 0.9rem; font-weight: 500; cursor: pointer;
}
.btn-analyze:hover { background: var(--btn-primary-hover); }
.btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-stop {
  padding: 10px 20px; background: var(--btn-danger); color: #fff; border: none; border-radius: 6px;
  font-size: 0.9rem; font-weight: 500; cursor: pointer; display: none;
}
.btn-stop:hover { background: var(--btn-danger-hover); }
.btn-export {
  padding: 8px 18px; background: var(--btn-secondary-bg); color: var(--text-primary);
  border: 1px solid var(--border-input); border-radius: 6px; font-size: 0.82rem; cursor: pointer; display: none;
}
.btn-export:hover { background: var(--btn-secondary-hover); }
.status-text { font-size: 0.82rem; color: var(--text-muted); }

/* History panel */
.history-panel {
  background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 8px;
  margin-bottom: 16px; overflow: hidden;
}
.history-header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; user-select: none;
}
.history-header:hover { background: var(--bg-card-hover); }
.history-header .toggle-arrow { font-size: 0.75rem; color: var(--text-muted); transition: transform 0.2s; width: 12px; }
.history-header .toggle-arrow.open { transform: rotate(90deg); }
.history-title { font-weight: 600; font-size: 0.9rem; flex: 1; }
.history-count { font-size: 0.75rem; color: var(--text-muted); }
.history-body { display: none; border-top: 1px solid var(--border-light); max-height: 300px; overflow-y: auto; }
.history-body.open { display: block; }
.history-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  border-bottom: 1px solid var(--border-subtle); cursor: pointer; font-size: 0.82rem;
}
.history-item:last-child { border-bottom: none; }
.history-item:hover { background: var(--bg-card-hover); }
.history-item-date { color: var(--text-muted); white-space: nowrap; font-size: 0.75rem; min-width: 120px; }
.history-item-prompt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
.history-item-delete {
  padding: 2px 8px; border: 1px solid var(--border-main); border-radius: 4px; background: var(--bg-card);
  font-size: 0.7rem; color: var(--text-muted); cursor: pointer;
}
.history-item-delete:hover { color: var(--btn-danger); border-color: var(--btn-danger); }
.history-empty { padding: 16px; text-align: center; color: var(--text-muted); font-size: 0.82rem; }
.history-search { padding: 8px 16px; border-bottom: 1px solid var(--border-light); }
.history-search input {
  width: 100%; padding: 6px 10px; border: 1px solid var(--border-input); border-radius: 6px;
  font-size: 0.82rem; background: var(--bg-input); color: var(--text-primary);
}

/* Results */
.results { display: flex; flex-direction: column; gap: 16px; }
.results-phase-group { display: flex; flex-direction: column; gap: 16px; }
.results-phase-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 768px) { .results-phase-2 { grid-template-columns: 1fr; } }

.result-card {
  background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 8px; overflow: hidden;
  border-left: 4px solid var(--agent-color, var(--text-muted));
}
.result-card-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  border-bottom: 1px solid var(--border-light); cursor: pointer; user-select: none;
}
.result-card-header:hover { background: var(--bg-card-hover); }
.result-agent-name { font-weight: 600; font-size: 0.9rem; flex: 1; color: var(--agent-color, var(--text-primary)); }
.result-header-actions { display: flex; gap: 6px; align-items: center; }

.chevron {
  font-size: 0.65rem; color: var(--text-muted); transition: transform 0.2s; display: inline-block;
}
.chevron.collapsed { transform: rotate(-90deg); }

.token-badge {
  font-size: 0.65rem; color: var(--text-muted); padding: 2px 8px;
  background: var(--bg-code); border-radius: 10px; white-space: nowrap;
}

.btn-copy {
  padding: 4px 12px; background: var(--btn-copy-bg); border: 1px solid var(--border-input); border-radius: 4px;
  font-size: 0.75rem; cursor: pointer; color: var(--text-secondary);
}
.btn-copy:hover { background: var(--btn-copy-hover); }

.result-card-body {
  padding: 16px; font-size: 0.88rem; line-height: 1.7; overflow-wrap: break-word;
}
.result-card-body.collapsed { display: none; }
.result-card-body h1, .result-card-body h2, .result-card-body h3 { margin: 12px 0 6px; }
.result-card-body h1 { font-size: 1.15rem; }
.result-card-body h2 { font-size: 1.05rem; }
.result-card-body h3 { font-size: 0.95rem; }
.result-card-body ul, .result-card-body ol { padding-left: 20px; margin: 6px 0; }
.result-card-body p { margin: 6px 0; }
.result-card-body code { background: var(--bg-code); padding: 2px 5px; border-radius: 3px; font-size: 0.84rem; }
.result-card-body pre { background: var(--bg-code); padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
.result-card-body pre code { background: none; padding: 0; }
.result-card-body blockquote { border-left: 3px solid var(--blockquote-border); padding-left: 12px; color: var(--blockquote-text); margin: 6px 0; }
.result-card-body strong { font-weight: 600; }
.result-card-body em { font-style: italic; }

/* Follow-up */
.followup-area {
  display: none; padding: 12px 16px; border-top: 1px solid var(--border-light); background: var(--bg-card-alt);
}
.followup-area.open { display: flex; gap: 8px; align-items: flex-start; }
.followup-area.collapsed { display: none !important; }
.followup-area textarea {
  flex: 1; padding: 8px 10px; border: 1px solid var(--border-input); border-radius: 6px;
  font-family: inherit; font-size: 0.82rem; resize: vertical; min-height: 40px; line-height: 1.4;
  background: var(--bg-input); color: var(--text-primary);
}
.btn-followup {
  padding: 8px 16px; background: var(--btn-primary-bg); color: var(--btn-primary-text); border: none; border-radius: 6px;
  font-size: 0.8rem; cursor: pointer; white-space: nowrap;
}
.btn-followup:hover { background: var(--btn-primary-hover); }
.btn-followup:disabled { opacity: 0.5; cursor: not-allowed; }

/* Cost summary */
.cost-summary {
  background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 8px;
  padding: 12px 16px; font-size: 0.82rem; color: var(--text-secondary);
}
.cost-summary .cost-total { font-weight: 600; color: var(--text-primary); }

.spinner {
  display: inline-block; width: 14px; height: 14px; border: 2px solid var(--spinner-track);
  border-top-color: var(--spinner-head); border-radius: 50%; animation: spin 0.6s linear infinite;
  margin-right: 6px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>Multi-Perspective AI Assistant</h1>
<p class="subtitle">Analyze problems from multiple viewpoints using Claude</p>

<!-- Settings -->
<div class="settings-bar">
  <div>
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." />
  </div>
  <div>
    <label for="modelSelect">Model</label>
    <select id="modelSelect">
      <option value="claude-opus-4-0-20250115">Claude Opus 4</option>
      <option value="claude-sonnet-4-20250514" selected>Claude Sonnet 4</option>
      <option value="claude-haiku-4-20250414">Claude Haiku 4</option>
    </select>
  </div>
  <div style="margin-left: auto;">
    <label>&nbsp;</label>
    <button class="btn-dark-toggle" id="btnDarkMode" onclick="toggleDarkMode()">Dark Mode</button>
  </div>
</div>

<!-- Presets -->
<div class="presets-bar">
  <div>
    <label>Presets</label>
    <select id="presetSelect" onchange="loadPreset()">
      <option value="">-- Default --</option>
    </select>
  </div>
  <input type="text" id="presetName" placeholder="New preset name..." />
  <button class="btn-sm" onclick="savePreset()">Save preset</button>
  <button class="btn-sm danger" onclick="deletePreset()">Delete</button>
</div>

<!-- Agent Config -->
<div class="agents-config" id="agentsConfig"></div>

<!-- History -->
<div class="history-panel">
  <div class="history-header" onclick="toggleHistory()">
    <span class="toggle-arrow" id="historyArrow">&#9654;</span>
    <span class="history-title">History</span>
    <span class="history-count" id="historyCount"></span>
  </div>
  <div class="history-body" id="historyBody">
    <div class="history-search">
      <input type="text" id="historySearch" placeholder="Search history..." oninput="renderHistory()" />
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- Prompt Input -->
<div class="prompt-area">
  <textarea id="promptInput" placeholder="Describe the problem or topic you want analyzed from multiple perspectives..."></textarea>
  <div class="prompt-actions">
    <button class="btn-analyze" id="btnAnalyze" onclick="runAnalysis()">Analyze</button>
    <button class="btn-stop" id="btnStop" onclick="stopAnalysis()">Stop</button>
    <button class="btn-export" id="btnExport" onclick="exportAnalysis()">Export Markdown</button>
    <span class="status-text" id="statusText"></span>
  </div>
</div>

<!-- Results -->
<div class="results" id="results"></div>

<script>
// ══════════════════════════════════
// ── Constants ──
// ══════════════════════════════════

const DEFAULT_AGENTS = [
  { id: 'visionary', name: 'Visionary / Creative', phase: 1, color: '#6c5ce7',
    prompt: 'You are a visionary and creative thinker. Your role is to analyze the given problem with imagination, originality, and bold thinking. Look beyond conventional approaches. Propose innovative ideas, unexpected connections, and creative possibilities. Think about what could be rather than what is. Be ambitious and inspiring, but still grounded enough to be actionable.',
    temp: 0.9, enabled: true, isDefault: true },
  { id: 'optimistic', name: 'Optimistic', phase: 2, color: '#00b894',
    prompt: 'You are an optimistic analyst. You have received a creative/visionary analysis of a problem. Your role is to build on it by identifying the strongest opportunities, best-case scenarios, and most promising paths forward. Highlight potential benefits, favorable conditions, and reasons for confidence. Be genuinely encouraging but substantive \u2014 back your optimism with reasoning.',
    temp: 0.7, enabled: true, isDefault: true },
  { id: 'sceptical', name: 'Sceptical', phase: 2, color: '#e17055',
    prompt: 'You are a sceptical analyst and critical thinker. You have received a creative/visionary analysis of a problem. Your role is to stress-test it by identifying risks, weaknesses, blind spots, and potential failure modes. Ask the hard questions. Challenge assumptions. Point out what could go wrong and what has been overlooked. Be constructively critical \u2014 your goal is to strengthen the final outcome, not to shut ideas down.',
    temp: 0.5, enabled: true, isDefault: true },
  { id: 'neutral', name: 'Neutral Summarizer', phase: 3, color: '#0984e3',
    prompt: 'You are a neutral, balanced synthesizer. You have received analyses from multiple perspectives. Your role is to:\n1. Summarize the key arguments from each perspective fairly\n2. Identify areas of agreement and disagreement\n3. Weigh the arguments and propose a balanced, actionable recommendation\n4. Suggest a concrete way forward that accounts for both opportunities and risks\n\nBe clear, structured, and pragmatic.',
    temp: 0.4, enabled: true, isDefault: true },
  { id: 'cfo', name: 'Financial Analyst (CFO)', phase: 2, color: '#fdcb6e',
    prompt: `You are an experienced Chief Financial Officer and financial analyst. You have received a creative/visionary analysis of a business problem or opportunity. Your role is to evaluate it through a rigorous financial lens:

1. **Financial Viability** — Estimate potential costs (CAPEX, OPEX), revenue impact, and ROI timeline. Flag any unrealistic financial assumptions.
2. **Cash Flow & Funding** — Assess how this would affect cash flow. Identify funding requirements and potential sources (internal budget, debt, equity, grants).
3. **Risk Quantification** — Assign rough financial risk levels. Consider market risk, currency exposure, credit risk, and operational cost overruns.
4. **Unit Economics** — Where applicable, analyze margins, customer acquisition cost (CAC), lifetime value (LTV), break-even point.
5. **Benchmarks & Comparables** — Reference industry benchmarks, comparable transactions, or standard financial ratios to ground your analysis.
6. **Recommendation** — Provide a clear financial verdict: invest, defer, restructure, or reject — with conditions and milestones.

Be precise with numbers where possible. Use ranges when uncertain. Structure your analysis so a board or investment committee can act on it.`,
    temp: 0.3, enabled: false, isDefault: true },
  { id: 'marketing', name: 'Marketing & Communications Expert', phase: 2, color: '#a29bfe',
    prompt: `You are a senior marketing strategist and communications expert. You have received a creative/visionary analysis of a business problem or opportunity. Your role is to evaluate it from a market positioning and communication standpoint:

1. **Market Opportunity** — Assess the target market size, segmentation, and customer personas. Who exactly would this serve, and is the market large/growing enough?
2. **Value Proposition** — Evaluate the clarity and strength of the value proposition. Can it be communicated in a compelling, differentiated way?
3. **Competitive Landscape** — Analyze how this positions against competitors. Identify unique selling points and potential competitive responses.
4. **Go-to-Market Strategy** — Suggest channels, messaging frameworks, and launch tactics. Consider digital, content, PR, partnerships, and sales enablement.
5. **Brand Impact** — Assess how this aligns with or stretches the existing brand. Flag any reputation risks or brand dilution concerns.
6. **Customer Journey** — Map out the acquisition funnel: awareness → consideration → conversion → retention. Identify friction points and acceleration opportunities.
7. **KPIs & Measurement** — Recommend specific marketing metrics and success criteria (conversion rate, NPS, share of voice, brand lift).

Be practical and actionable. Ground recommendations in real-world marketing tactics, not abstract theory.`,
    temp: 0.7, enabled: false, isDefault: true },
  { id: 'legal', name: 'Legal & Compliance Expert', phase: 2, color: '#636e72',
    prompt: `You are an experienced corporate legal counsel and compliance officer. You have received a creative/visionary analysis of a business problem or opportunity. Your role is to evaluate it from a legal and regulatory standpoint:

1. **Regulatory Landscape** — Identify applicable regulations, laws, and standards (e.g., GDPR, CCPA, SOX, industry-specific regulations). Flag jurisdictional considerations if the initiative spans multiple markets.
2. **Compliance Requirements** — List specific compliance obligations that must be met before and during execution. Identify required permits, licenses, certifications, or filings.
3. **Contractual Considerations** — Highlight potential contract needs (vendor agreements, partnerships, SLAs, NDAs, employment contracts). Flag unusual or high-risk terms.
4. **Intellectual Property** — Assess IP implications: patents, trademarks, copyrights, trade secrets. Identify both protection opportunities and infringement risks.
5. **Liability & Risk Exposure** — Identify potential legal liabilities (product liability, data breaches, employment law, third-party claims). Recommend mitigation strategies and insurance considerations.

// ── LocalStorage helpers ──

function lsGet(key, fallback) {
  try { const v = localStorage.getItem('mpai_' + key); return v !== null ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem('mpai_' + key, JSON.stringify(value)); } catch {}
}

// ── Agent Data Layer ──
// ══════════════════════════════════

function getAgents() {
  const stored = lsGet('agents_v2', null);
  if (stored) return stored;
  return JSON.parse(JSON.stringify(DEFAULT_AGENTS));
}

function saveAgents(list) {
  lsSet('agents_v2', list);
  agents = list;
}

function migrateIfNeeded() {
  const existing = lsGet('agents_v2', null);

  if (existing === null) {
    // Check for old per-agent keys (v1 → v2 migration)
    const hasOld = localStorage.getItem('mpai_agent_visionary_enabled') !== null
                || localStorage.getItem('mpai_agent_visionary_prompt') !== null;
    if (!hasOld) return;

    const migrated = DEFAULT_AGENTS.map(def => ({
      ...JSON.parse(JSON.stringify(def)),
      enabled: lsGet(`agent_${def.id}_enabled`, true),
      prompt: lsGet(`agent_${def.id}_prompt`, def.prompt),
      temp: lsGet(`agent_${def.id}_temp`, def.temp),
    }));
    saveAgents(migrated);

    // Migrate presets
    const presets = lsGet('presets', {});
    const migratedPresets = {};
    for (const [name, config] of Object.entries(presets)) {
      if (Array.isArray(config)) {
        migratedPresets[name] = config;
      } else {
        migratedPresets[name] = DEFAULT_AGENTS.map(def => ({
          ...JSON.parse(JSON.stringify(def)),
          enabled: config[def.id]?.enabled ?? true,
          prompt: config[def.id]?.prompt ?? def.prompt,
          temp: config[def.id]?.temp ?? def.temp,
        }));
      }
    }
    lsSet('presets', migratedPresets);
    return;
  }

  // Ensure all default agents exist (handles newly added defaults)
  ensureDefaultAgents(existing);
}

function ensureDefaultAgents(stored) {
  const storedIds = new Set(stored.map(a => a.id));
  const missing = DEFAULT_AGENTS.filter(def => !storedIds.has(def.id));
  if (missing.length === 0) return;

  // Insert missing defaults at the correct position (before custom agents, respecting phase order)
  const updated = [...stored];
  missing.forEach(def => {
    const agent = JSON.parse(JSON.stringify(def));
    // Find insertion index: after last default with same or lower phase, or at the end of defaults
    let insertIdx = updated.length;
    for (let i = updated.length - 1; i >= 0; i--) {
      if (updated[i].isDefault && updated[i].phase <= agent.phase) {
        insertIdx = i + 1;
        break;
      }
    }
    updated.splice(insertIdx, 0, agent);
  });
  saveAgents(updated);
}

// ── Agent CRUD ──
// ══════════════════════════════════

function saveAgentEnabled(agentId) {
  const checked = document.getElementById('enabled_' + agentId).checked;
  const agent = agents.find(a => a.id === agentId);
  if (agent) { agent.enabled = checked; saveAgents(agents); }
  const nameEl = document.getElementById('name_' + agentId);
  if (nameEl) nameEl.classList.toggle('disabled', !checked);
}

function saveAgentPrompt(agentId) {
  const agent = agents.find(a => a.id === agentId);
  if (agent) { agent.prompt = document.getElementById('prompt_' + agentId).value; saveAgents(agents); }
}

function saveAgentTemp(agentId) {
  const val = parseFloat(document.getElementById('temp_' + agentId).value);
  const agent = agents.find(a => a.id === agentId);
  if (agent) { agent.temp = val; saveAgents(agents); }
  document.getElementById('tempVal_' + agentId).textContent = val.toFixed(1);
  document.getElementById('tempDisplay_' + agentId).textContent = 'temp: ' + val.toFixed(1);
}

function saveAgentName(agentId) {
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;
  agent.name = document.getElementById('agentName_' + agentId).value;
  saveAgents(agents);
  const nameEl = document.getElementById('name_' + agentId);
  if (nameEl) nameEl.textContent = agent.name;
}

function saveAgentPhase(agentId) {
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;
  agent.phase = parseInt(document.getElementById('agentPhase_' + agentId).value);
  saveAgents(agents);
  initAgentPanels();
}

function addCustomAgent() {
  const usedColors = new Set(agents.map(a => a.color));
  const nextColor = COLOR_PALETTE.find(c => !usedColors.has(c)) || COLOR_PALETTE[agents.length % COLOR_PALETTE.length];
  const newAgent = {
    id: 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    name: 'New Agent',
    phase: 2,
    color: nextColor,
    prompt: 'You are a helpful analyst. Provide your unique perspective on the given topic.',
    temp: 0.7,
    enabled: true,
    isDefault: false,
  };
  agents.push(newAgent);
  saveAgents(agents);
  initAgentPanels();
  // Auto-expand the new agent
  const body = document.getElementById('body_' + newAgent.id);
  const arrow = document.getElementById('arrow_' + newAgent.id);
  if (body) body.classList.add('open');
  if (arrow) arrow.classList.add('open');
}

function removeAgent(agentId) {
  const agent = agents.find(a => a.id === agentId);
  if (!agent || agent.isDefault) return;
  if (!confirm(`Remove agent "${agent.name}"?`)) return;
  agents = agents.filter(a => a.id !== agentId);
  saveAgents(agents);
  initAgentPanels();
}

function getPresets() { return lsGet('presets', {}); }

function refreshPresetSelect() {
  const sel = document.getElementById('presetSelect');
  const current = sel.value;
  sel.innerHTML = '<option value="">-- Default --</option>';
  const presets = getPresets();
  Object.keys(presets).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function savePreset() {
  const nameInput = document.getElementById('presetName');
  const name = nameInput.value.trim();
  if (!name) return alert('Enter a preset name.');
  const presets = getPresets();
  presets[name] = JSON.parse(JSON.stringify(agents));
  setPresets(presets);
  refreshPresetSelect();
  document.getElementById('presetSelect').value = name;
  nameInput.value = '';
}

function loadPreset() {
  const name = document.getElementById('presetSelect').value;
  if (!name) {
    agents = JSON.parse(JSON.stringify(DEFAULT_AGENTS));
    saveAgents(agents);
  } else {
    const presets = getPresets();
    const config = presets[name];
    if (!config) return;
    if (Array.isArray(config)) {
      agents = JSON.parse(JSON.stringify(config));
    } else {
      // Old format migration
      agents = DEFAULT_AGENTS.map(def => ({
        ...JSON.parse(JSON.stringify(def)),
        enabled: config[def.id]?.enabled ?? true,
        prompt: config[def.id]?.prompt ?? def.prompt,
        temp: config[def.id]?.temp ?? def.temp,
      }));
    }
    saveAgents(agents);
  }
  initAgentPanels();
}

function deletePreset() {
  const name = document.getElementById('presetSelect').value;
  if (!name) return;
  if (!confirm(`Delete preset "${name}"?`)) return;
  const presets = getPresets();
  delete presets[name];
  setPresets(presets);
  document.getElementById('presetSelect').value = '';
  refreshPresetSelect();
}

function getHistory() { return lsGet('history', []); }
function setHistory(h) { lsSet('history', h); }

function toggleHistory() {
  const body = document.getElementById('historyBody');
  const arrow = document.getElementById('historyArrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
  if (body.classList.contains('open')) renderHistory();

function renderHistory() {
  const list = document.getElementById('historyList');
  const search = document.getElementById('historySearch').value.toLowerCase();
  const history = getHistory();
  document.getElementById('historyCount').textContent = `${history.length} saved`;

  const filtered = history.filter(h =>
    h.prompt.toLowerCase().includes(search) ||
    (h.date && h.date.toLowerCase().includes(search))
  );

  if (filtered.length === 0) {
    list.innerHTML = '<div class="history-empty">No analyses saved yet.</div>';
    return;
  }

  list.innerHTML = filtered.map(h => {
    const idx = history.indexOf(h);
    const date = h.date || 'Unknown date';
    const preview = h.prompt.length > 80 ? h.prompt.slice(0, 80) + '...' : h.prompt;
    return `<div class="history-item">
      <span class="history-item-date">${escapeHtml(date)}</span>
      <span class="history-item-prompt" onclick="loadHistory(${idx})">${escapeHtml(preview)}</span>
      <button class="history-item-delete" onclick="event.stopPropagation(); deleteHistory(${idx})">delete</button>
    </div>`;
  }).join('');
}

function saveToHistory(prompt, results, usage) {
  const history = getHistory();
  const entry = {
    date: new Date().toLocaleString(),
    prompt: prompt,
    results: { ...results },
    usage: usage ? { ...usage } : {},
    agentsMeta: agents
      .filter(a => results[a.id])
      .map(a => ({ id: a.id, name: a.name, phase: a.phase, color: a.color })),
  };
  history.unshift(entry);
  if (history.length > 50) history.length = 50;
  setHistory(history);
  renderHistory();
}

function loadHistory(idx) {
  const history = getHistory();
  const entry = history[idx];
  if (!entry) return;

  document.getElementById('promptInput').value = entry.prompt;
  currentPrompt = entry.prompt;
  currentResults = { ...entry.results };
  currentUsage = entry.usage ? { ...entry.usage } : {};

  const resultsContainer = document.getElementById('results');
  resultsContainer.innerHTML = '';

  // Use agentsMeta if available, fall back to current agents or defaults
  const meta = entry.agentsMeta || DEFAULT_AGENTS
    .filter(a => entry.results[a.id])
    .map(a => ({ id: a.id, name: a.name, phase: a.phase, color: a.color }));

  const byPhase = {};
  meta.forEach(am => {
    if (!entry.results[am.id]) return;
    if (!byPhase[am.phase]) byPhase[am.phase] = [];
    byPhase[am.phase].push(am);
  });

  Object.keys(byPhase).map(Number).sort().forEach(phase => {
    const group = byPhase[phase];
    const wrapper = document.createElement('div');
    wrapper.className = (phase === 2 && group.length > 1) ? 'results-phase-2' : 'results-phase-group';
    group.forEach(am => {
      const card = createResultCard({ id: am.id, name: am.name, color: am.color, phase: am.phase }, true);
      wrapper.appendChild(card);
      document.getElementById('output_' + am.id).innerHTML = renderMarkdown(entry.results[am.id]);
      if (entry.usage && entry.usage[am.id]) updateTokenBadge(am.id, entry.usage[am.id]);
    });
    resultsContainer.appendChild(wrapper);
  });

  if (Object.keys(currentUsage).length > 0) renderCostSummary();
  document.getElementById('btnExport').style.display = 'inline-block';
  document.getElementById('statusText').textContent = 'Loaded from history.';
}

function deleteHistory(idx) {
  const history = getHistory();
  history.splice(idx, 1);
  setHistory(history);
  renderHistory();
}

// ══════════════════════════════════
// ── Markdown rendering ──
// ══════════════════════════════════

function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*<\/p>/g, '');
  html = html.replace(/<p>(<h[123]>)/g, '$1');
  html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
  return html;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ══════════════════════════════════
// ── Export ──
// ══════════════════════════════════

function exportAnalysis() {
  if (!currentPrompt) return;

  let md = `# Multi-Perspective Analysis\n\n`;
  md += `**Date:** ${new Date().toLocaleString()}\n\n`;
  md += `## Prompt\n\n${currentPrompt}\n\n`;

  agents.forEach(agent => {
    if (currentResults[agent.id]) {
      md += `---\n\n## ${agent.name} (Phase ${agent.phase})\n\n${currentResults[agent.id]}\n\n`;
    }
  });

  if (Object.keys(currentUsage).length > 0) {
    md += `---\n\n## Token Usage\n\n`;
    const model = document.getElementById('modelSelect').value;
    let totalIn = 0, totalOut = 0;
    agents.forEach(agent => {
      const u = currentUsage[agent.id];
      if (u) {
        md += `- **${agent.name}**: ${u.input_tokens.toLocaleString()} input, ${u.output_tokens.toLocaleString()} output\n`;
        totalIn += u.input_tokens; totalOut += u.output_tokens;
      }
    });
    const cost = calculateCost(totalIn, totalOut, model);
    md += `\n**Total**: ${totalIn.toLocaleString()} input, ${totalOut.toLocaleString()} output tokens\n`;
    md += `**Estimated cost**: $${cost.toFixed(4)}\n`;
  }

  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const slug = currentPrompt.slice(0, 40).replace(/[^a-zA-Z0-9]+/g, '-').replace(/-+$/, '');
  a.download = `analysis-${slug}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

// ══════════════════════════════════
// ── Token / Cost ──
// ══════════════════════════════════

function calculateCost(inputTokens, outputTokens, model) {
  const pricing = MODEL_PRICING[model] || MODEL_PRICING['claude-sonnet-4-20250514'];
  return (inputTokens / 1_000_000) * pricing.input + (outputTokens / 1_000_000) * pricing.output;
}

function updateTokenBadge(agentId, usage) {
  const badge = document.getElementById('tokenBadge_' + agentId);
  if (!badge) return;
  badge.textContent = `${usage.input_tokens.toLocaleString()} in / ${usage.output_tokens.toLocaleString()} out`;
  badge.style.display = '';
}

function renderCostSummary() {
  const existing = document.getElementById('costSummary');
  if (existing) existing.remove();
  if (Object.keys(currentUsage).length === 0) return;

  const model = document.getElementById('modelSelect').value;
  let totalIn = 0, totalOut = 0;
  const lines = [];

  agents.forEach(agent => {
    const u = currentUsage[agent.id];
    if (u) {
      totalIn += u.input_tokens; totalOut += u.output_tokens;
      const c = calculateCost(u.input_tokens, u.output_tokens, model);
      lines.push(`<span style="color:${agent.color}; font-weight:500;">${escapeHtml(agent.name)}</span>: ${u.input_tokens.toLocaleString()} in / ${u.output_tokens.toLocaleString()} out ($${c.toFixed(4)})`);
    }
  });

  // Also check history agents not in current agents list
  Object.keys(currentUsage).forEach(id => {
    if (!agents.find(a => a.id === id)) {
      const u = currentUsage[id];
      totalIn += u.input_tokens; totalOut += u.output_tokens;
    }
  });

  const totalCost = calculateCost(totalIn, totalOut, model);
  const div = document.createElement('div');
  div.className = 'cost-summary';
  div.id = 'costSummary';
  div.innerHTML = `
    <div style="margin-bottom:6px; font-weight:600;">Token Usage & Cost</div>
    ${lines.map(l => `<div style="margin-bottom:2px;">${l}</div>`).join('')}
    <div style="margin-top:8px; border-top:1px solid var(--border-light); padding-top:6px;">
      <span class="cost-total">Total: ${totalIn.toLocaleString()} in / ${totalOut.toLocaleString()} out &mdash; $${totalCost.toFixed(4)}</span>
    </div>
  `;
  document.getElementById('results').appendChild(div);
}

// ══════════════════════════════════
// ── API call ──
// ══════════════════════════════════

async function callClaude(systemPrompt, messages, temperature, signal) {
  const apiKey = lsGet('apiKey', '');
  const model = document.getElementById('modelSelect').value;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: model,
      max_tokens: 4096,
      temperature: temperature,
      system: systemPrompt,
      messages: messages,
      stream: true,
    }),
    signal: signal,
  });

  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API error ${response.status}: ${err}`);
  }

  return response.body;
}

async function streamResponse(stream, outputEl) {
  const reader = stream.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  let buffer = '';
  let usage = { input_tokens: 0, output_tokens: 0 };

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (line.startsWith('data: ')) {
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
            fullText += parsed.delta.text;
            outputEl.innerHTML = renderMarkdown(fullText);
          }
          if (parsed.type === 'message_start' && parsed.message?.usage) {
            usage.input_tokens = parsed.message.usage.input_tokens || 0;
          }
          if (parsed.type === 'message_delta' && parsed.usage) {
            usage.output_tokens = parsed.usage.output_tokens || 0;
          }
        } catch {}
      }
    }
  }

  return { text: fullText, usage };
}

// ══════════════════════════════════
// ── Result cards ──
// ══════════════════════════════════

function createResultCard(agent, showFollowup) {
  const card = document.createElement('div');
  card.className = 'result-card';
  card.id = `result_${agent.id}`;
  card.style.setProperty('--agent-color', agent.color);

  card.innerHTML = `
    <div class="result-card-header" onclick="toggleCardCollapse('${agent.id}')">
      <span class="chevron" id="chevron_${agent.id}">&#9660;</span>
      <span class="result-agent-name">${showFollowup ? '' : '<span class="spinner"></span>'}${escapeHtml(agent.name)}</span>
      <span class="token-badge" id="tokenBadge_${agent.id}" style="display:none"></span>
      <div class="result-header-actions" onclick="event.stopPropagation()">
        <button class="btn-copy" onclick="copyResult('${agent.id}')" ${showFollowup ? '' : 'style="display:none"'} id="copyBtn_${agent.id}">Copy</button>
      </div>
    </div>
    <div class="result-card-body" id="output_${agent.id}"></div>
    <div class="followup-area ${showFollowup ? 'open' : ''}" id="followup_${agent.id}">
      <textarea id="followupInput_${agent.id}" placeholder="Ask a follow-up question to this agent..."
                onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();runFollowup('${agent.id}')}"></textarea>
      <button class="btn-followup" onclick="runFollowup('${agent.id}')" id="followupBtn_${agent.id}">Ask</button>
    </div>
  `;
  return card;
}

function toggleCardCollapse(agentId) {
  const body = document.getElementById('output_' + agentId);
  const followup = document.getElementById('followup_' + agentId);
  const chevron = document.getElementById('chevron_' + agentId);

  const isCollapsed = body.classList.toggle('collapsed');
  if (followup) followup.classList.toggle('collapsed', isCollapsed);
  if (chevron) chevron.classList.toggle('collapsed', isCollapsed);
}

function copyResult(agentId) {
  const el = document.getElementById('output_' + agentId);
  const text = el.innerText || el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn_' + agentId);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

function finishCard(agentId, usage) {
  const card = document.getElementById('result_' + agentId);
  if (!card) return;
  const spinner = card.querySelector('.spinner');
  if (spinner) spinner.remove();
  const copyBtn = document.getElementById('copyBtn_' + agentId);
  if (copyBtn) copyBtn.style.display = '';
  const followup = document.getElementById('followup_' + agentId);
  if (followup) followup.classList.add('open');
  if (usage) updateTokenBadge(agentId, usage);
}

// ══════════════════════════════════
// ── Follow-up ──
// ══════════════════════════════════

async function runFollowup(agentId) {
  const input = document.getElementById('followupInput_' + agentId);
  const question = input.value.trim();
  if (!question) return;
  if (!lsGet('apiKey', '')) return alert('Please enter your API key.');

  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;

  const btn = document.getElementById('followupBtn_' + agentId);
  const outputEl = document.getElementById('output_' + agentId);
  const prevContent = currentResults[agentId] || '';

  btn.disabled = true;
  btn.textContent = '...';

  const separator = document.createElement('hr');
  separator.style.cssText = 'margin: 16px 0; border: none; border-top: 1px solid var(--border-main);';
  outputEl.appendChild(separator);

  const followupOutput = document.createElement('div');
  followupOutput.innerHTML = '<span class="spinner"></span>';
  outputEl.appendChild(followupOutput);

  const followupAbort = new AbortController();

  try {
    // Build context generically based on phase
    let contextMsg = `Original problem/topic:\n${currentPrompt}`;

    // Include outputs from all agents in prior phases
    agents
      .filter(a => a.phase < agent.phase && currentResults[a.id])
      .sort((a, b) => a.phase - b.phase)
      .forEach(priorAgent => {
        contextMsg += `\n\n---\n\n${priorAgent.name} analysis:\n${currentResults[priorAgent.id]}`;
      });

    const messages = [
      { role: 'user', content: contextMsg },
      { role: 'assistant', content: prevContent },
      { role: 'user', content: question },
    ];

    const stream = await callClaude(agent.prompt, messages, agent.temp, followupAbort.signal);
    const { text: result } = await streamResponse(stream, followupOutput);

    currentResults[agentId] = prevContent + '\n\n---\n\n**Follow-up:** ' + question + '\n\n' + result;
    input.value = '';
  } catch (err) {
    followupOutput.innerHTML = `<p style="color:var(--btn-danger)">Error: ${escapeHtml(err.message)}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ask';
  }
}

// ══════════════════════════════════
// ── Main analysis flow ──
// ══════════════════════════════════

async function runAnalysis() {
  const prompt = document.getElementById('promptInput').value.trim();
  if (!prompt) return alert('Please enter a prompt.');
  if (!lsGet('apiKey', '')) return alert('Please enter your API key.');

  const btnAnalyze = document.getElementById('btnAnalyze');
  const btnStop = document.getElementById('btnStop');
  const btnExport = document.getElementById('btnExport');
  const statusText = document.getElementById('statusText');
  const resultsContainer = document.getElementById('results');

  btnAnalyze.disabled = true;
  btnStop.style.display = 'inline-block';
  btnExport.style.display = 'none';
  resultsContainer.innerHTML = '';
  abortController = new AbortController();
  currentResults = {};
  currentUsage = {};
  currentPrompt = prompt;

  // Group enabled agents by phase
  const enabledAgents = agents.filter(a => a.enabled !== false);
  const phaseGroups = {};
  enabledAgents.forEach(a => {
    if (!phaseGroups[a.phase]) phaseGroups[a.phase] = [];
    phaseGroups[a.phase].push(a);
  });
  const phases = Object.keys(phaseGroups).map(Number).sort();

  try {
    for (const phase of phases) {
      const phaseAgents = phaseGroups[phase];

      // Build user message: prompt + all prior phase outputs
      let userMsg = prompt;
      if (phase > Math.min(...phases)) {
        userMsg = `Original problem/topic:\n${prompt}`;
        const priorPhases = phases.filter(p => p < phase);
        for (const pp of priorPhases) {
          for (const priorAgent of (phaseGroups[pp] || [])) {
            if (currentResults[priorAgent.id]) {
              userMsg += `\n\n---\n\n${priorAgent.name} analysis:\n${currentResults[priorAgent.id]}`;
            }
          }
        }
      }

      // Create wrapper (grid for phase 2 with 2+ agents)
      const wrapper = document.createElement('div');
      wrapper.className = (phase === 2 && phaseAgents.length > 1) ? 'results-phase-2' : 'results-phase-group';

      phaseAgents.forEach(a => {
        const card = createResultCard(a, false);
        wrapper.appendChild(card);
      });
      resultsContainer.appendChild(wrapper);

      const names = phaseAgents.map(a => a.name).join(' + ');
      statusText.textContent = `Phase ${phase}: Running ${names}...`;

      // Run all agents in this phase in parallel
      const promises = phaseAgents.map(async agent => {
        const outputEl = document.getElementById('output_' + agent.id);
        const stream = await callClaude(agent.prompt, [{ role: 'user', content: userMsg }], agent.temp, abortController.signal);
        const { text, usage } = await streamResponse(stream, outputEl);
        currentResults[agent.id] = text;
        currentUsage[agent.id] = usage;
        finishCard(agent.id, usage);
      });

      await Promise.all(promises);
    }

    saveToHistory(prompt, currentResults, currentUsage);
    renderCostSummary();

    statusText.textContent = 'Done.';
    btnExport.style.display = 'inline-block';
  } catch (err) {
    if (err.name === 'AbortError') {
      statusText.textContent = 'Stopped.';
    } else {
      statusText.textContent = 'Error: ' + err.message;
      console.error(err);
    }
    if (Object.keys(currentResults).length > 0) {
      btnExport.style.display = 'inline-block';
      saveToHistory(prompt, currentResults, currentUsage);
      renderCostSummary();
    }
  } finally {
    btnAnalyze.disabled = false;
    btnStop.style.display = 'none';
    abortController = null;
  }
}

function stopAnalysis() {
  if (abortController) abortController.abort();
}

// ══════════════════════════════════
// ── Boot ──
// ══════════════════════════════════

migrateIfNeeded();
agents = getAgents();
initSettings();
initAgentPanels();
refreshPresetSelect();
renderHistory();
</script>
